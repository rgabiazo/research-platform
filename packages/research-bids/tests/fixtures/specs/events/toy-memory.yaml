{
  "name": "toy-memory",
  "source": {
    "encoding": "utf-8-sig",
    "subject_column": "toy_id",
    "subject_regex": "^(toy\\d+)$",
    "subject_width": 0,
    "session_column": "visit",
    "session_regex": "^visit(\\d+)$",
    "session_width": 2,
    "run_column": "run",
    "stim_column": "stimulus_file"
  },
  "entities": {
    "task": "toymemory",
    "dir": "AP",
    "datatype": "func",
    "suffix": "events"
  },
  "output": {
    "missing_value": "n/a",
    "columns": [
      "onset",
      "duration",
      "trial_type",
      "stim_file",
      "response_time",
      "response",
      "phase",
      "condition",
      "stim_id",
      "acc_label",
      "probe_type",
      "enc_is_tested",
      "enc_later_outcome",
      "is_instruction",
      "is_error",
      "block_n",
      "trial_n",
      "analysis_include"
    ]
  },
  "runs": [1, 2, 3],
  "conditions": {
    "shape": { "title": "shape" },
    "color": { "title": "color" },
    "word": { "title": "word" }
  },
  "phase_templates": [
    {
      "phase": "encoding",
      "image_prefix_template": "toy_run{run}_{condition_title}_encoding",
      "onset_column_template": "toy_run{run}_encoding_onset",
      "response_time_column_template": "toy_run{run}_encoding_response_time",
      "trial_type_template": "encoding_{condition}",
      "instruction_trial_type_template": "instruction_{condition}_encoding",
      "duration": "3.0",
      "instruction_duration": "10.0",
      "instruction_offset": "10.0",
      "block_n": "1",
      "instruction_probe_type": "n/a"
    },
    {
      "phase": "recognition",
      "image_prefix_template": "toy_run{run}_{condition_title}_recognition",
      "onset_column_template": "toy_run{run}_recognition_onset",
      "response_time_column_template": "toy_run{run}_recognition_response_time",
      "trial_type_template": "recognition_{condition}",
      "instruction_trial_type_template": "instruction_{condition}_recognition",
      "duration": "3.0",
      "instruction_duration": "10.0",
      "instruction_offset": "10.0",
      "block_n": "2",
      "instruction_probe_type": "lure"
    }
  ]
}
